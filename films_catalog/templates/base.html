{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Каталог анимации{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:home' %}">Анима-каталог</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#main-navigation" aria-controls="main-navigation"
                    aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'homepage:home' %}">Главная</a>
                    <a class="nav-link" href="{% url 'films:list' %}">Каталог</a>
                    <a class="nav-link" href="{% url 'homepage:users' %}">Пользователи</a>
                    <a class="nav-link" href="{% url 'homepage:about' %}">О проекте</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-top py-3 mt-4">
        <div class="container text-muted">Каталог анимационных фильмов и сериалов</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/site.js' %}"></script>
</body>
</html>
