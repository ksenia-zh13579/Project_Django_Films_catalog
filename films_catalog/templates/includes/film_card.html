<article class="card h-100 film-card">
    <div class="card-body d-flex flex-column">
        <h2 class="card-title h5">{{ film.name }}</h2>
        <p class="card-text text-muted mb-2">{{ film.director }}</p>
        <div class="mb-3">
            {% for genre in film.genres %}
                <span class="badge text-bg-secondary">{{ genre|capfirst }}</span>
            {% empty %}
                <span class="text-muted">Жанры не указаны</span>
            {% endfor %}
        </div>
        <p class="card-text mt-auto">
            <strong>{{ film.average_rating|floatformat:1 }}</strong>/10
            <span class="text-muted">({{ film.ratings|length }} оцен.)</span>
        </p>
        <a class="btn btn-outline-primary" href="{% url 'films:detail' forloop.counter0 %}">
            Подробнее
        </a>
    </div>
</article>
